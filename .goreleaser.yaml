# goreleaser replaces the hand-rolled build matrix: it cross-compiles,
# archives, checksums, attaches to the release and writes the Homebrew
# formula, from one description instead of sixty lines of shell.
#
# It does NOT own versioning. release-please decides the version and creates
# the tag and the release with its changelog; goreleaser only adds binaries to
# what already exists — hence release.mode below.
version: 2

project_name: spillway

builds:
  - id: spillway
    main: ./cmd/spillway
    binary: spillway
    # Asserted, not assumed. Everything here is pure Go (modernc sqlite, an
    # embedded dashboard), and a cgo dependency creeping in should fail the
    # release loudly rather than quietly produce a host-linked binary.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # .Tag, not .Version: .Version strips the leading v, and the binary
      # should report the same string the tag and the release use.
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: spillway
    name_template: "spillway_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # zip on Windows: Explorer opens it natively and needs a third-party tool
    # for a tarball.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  # release-please already created the release and owns its body — that body
  # is the changelog. Anything that rewrites it replaces the changelog with
  # something worse, so goreleaser only uploads artifacts.
  mode: keep-existing

# goreleaser's own changelog is unused for the same reason.
changelog:
  disable: true

homebrew_casks:
  # A cask, not a formula: `brews` is deprecated because Homebrew now wants
  # pre-built binaries distributed as casks. `directory: Casks` follows —
  # brew looks for casks there, not in Formula/.
  - name: spillway
    repository:
      owner: coderage-labs
      name: homebrew-tap
      branch: main
      # A fine-grained PAT with Contents:write on the tap ONLY. GITHUB_TOKEN
      # cannot reach another repository, which is the whole reason this
      # secret exists.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/coderage-labs/spillway"
    description: "Pool your own AI subscription accounts behind one local proxy"
    license: MIT
    binaries: [spillway]
    commit_author:
      name: Kriskit
      email: chris@coderage.co.uk
    # Only on `brew uninstall --zap`, never on upgrade — which is what makes
    # it the safe place for this. A plain uninstall deletes the binary and
    # leaves the launch agent pointing at nothing, so it is worth knowing
    # that --zap is the one that tidies up after itself.
    zap:
      launchctl:
        - dev.coderage.spillway
      trash:
        - ~/Library/LaunchAgents/dev.coderage.spillway.plist
        - ~/Library/Logs/spillway.log
    hooks:
      post:
        # Downloaded archives carry the quarantine attribute, and the binary
        # is unsigned. Without this every install is met with "cannot be
        # opened because the developer cannot be verified".
        #
        # Then: if a launch agent is already registered, re-register it. brew
        # replaces the binary but does not touch the running daemon, which
        # keeps serving from the deleted inode of the version it started on —
        # so an upgrade appeared to work while the old code was still running,
        # and only a manual `spillway service install` actually swapped it.
        #
        # Guarded on the plist existing, so this never installs a service for
        # someone who has not asked for one, and must_succeed:false so a
        # failure to restart cannot fail the upgrade.
        #
        # HOMEBREW_PREFIX, not staged_path: the plist records the path it is
        # invoked by, and the Caskroom path is versioned and deleted by the
        # next upgrade.
        install: |
          if OS.mac?
            system "xattr", "-d", "-r", "com.apple.quarantine", "#{staged_path}/spillway"

            if File.exist?("#{Dir.home}/Library/LaunchAgents/dev.coderage.spillway.plist")
              ohai "Restarting the spillway service on the new binary"
              system_command "#{HOMEBREW_PREFIX}/bin/spillway",
                             args: ["service", "install"],
                             must_succeed: false
            end
          end

# Scoop, not WinGet or Chocolatey. Both of those install machine-wide by
# default, and spillway is per-user by construction: the tokens live in this
# user's Credential Manager, which a machine-wide install has no business
# reaching. Scoop installs under the user's own profile, and — unlike WinGet
# for a plain zip — gives a post-install hook, which is what keeps an upgrade
# from leaving the old daemon running.
scoops:
  - name: spillway
    repository:
      owner: coderage-labs
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/coderage-labs/spillway"
    description: "Pool your own AI subscription accounts behind one local proxy"
    license: MIT
    commit_author:
      name: Kriskit
      email: chris@coderage.co.uk
    # The macOS cask's postflight, in PowerShell. Same reasoning: scoop
    # replaces the binary but does not touch the running daemon, and the
    # Scheduled Task holds an absolute path to the version it was registered
    # with. Guarded on the task already existing, so it never registers a
    # service nobody asked for, and silent on failure so a restart that does
    # not work cannot fail the upgrade.
    # The macOS cask's postflight, in PowerShell. Same reasoning: scoop
    # replaces the binary but does not touch the running daemon, and the
    # Scheduled Task holds an absolute path to the version it was registered
    # with. Guarded on the task already existing, so it never registers a
    # service nobody asked for, and quiet on failure so a restart that does
    # not work cannot fail the upgrade.
    #
    # $LASTEXITCODE, not the truthiness of schtasks' output: `if (schtasks
    # ...)` tests whether anything was printed, which is a different question
    # and one that locale and stderr redirection both change the answer to.
    #
    # Get-Command, not $dir: $dir is ~/scoop/apps/spillway/<version>, which
    # the next upgrade deletes. `service install` records the path it is
    # invoked by into the task, so it has to be the shim — the one path that
    # survives. If the shim is not on PATH yet this does nothing, which is the
    # right way to be wrong here.
    post_install:
      - 'schtasks /Query /TN "\dev.coderage.spillway" *> $null'
      - 'if ($LASTEXITCODE -eq 0) {'
      - '  $exe = (Get-Command spillway.exe -ErrorAction SilentlyContinue).Source'
      - '  if ($exe) {'
      - '    Write-Host "Restarting the spillway service on the new binary"'
      - '    & $exe service install | Out-Null'
      - '  } else {'
      - "    Write-Host 'spillway: shim not found - run: spillway service install'"
      - '  }'
      - '}'
