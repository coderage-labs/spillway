name: Release

# release-please owns versioning: it accumulates a release PR from commit
# messages, and merging that PR is the decision to ship. See RELEASING.md.
#
# The build is gated on release-please's OUTPUT rather than on the tag it
# pushes. That is not a style choice: a tag created with GITHUB_TOKEN does not
# trigger `on: push: tags`, so the tag-driven version of this workflow
# produces a Release with notes and no binaries.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload assets for"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      # ship is the single signal the rest of the workflow keys off, so the
      # release-please path and the manual path stay identical downstream.
      ship: ${{ steps.decide.outputs.ship }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        if: github.event_name == 'push'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: decide
        env:
          CREATED: ${{ steps.rp.outputs.release_created }}
          RP_TAG: ${{ steps.rp.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${CREATED:-}" = "true" ]; then
            echo "ship=true"        >> "$GITHUB_OUTPUT"
            echo "tag=${RP_TAG}"    >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_TAG:-}" ]; then
            echo "ship=true"        >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            # The common case: a push that only updated the release PR.
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

  # Re-run the gate at the released commit rather than trusting that CI passed
  # on main. Cheap, and the one place where "the thing we shipped" and "the
  # thing we tested" are provably the same.
  verify:
    needs: plan
    if: needs.plan.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # goreleaser replaces the previous build+publish jobs: the cross-compile
  # matrix, the archive naming, the checksums and the asset upload are all in
  # .goreleaser.yaml now, and it writes the Homebrew cask in the same pass.
  release:
    needs: [plan, verify]
    if: needs.plan.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          # goreleaser derives version metadata from git; a shallow clone
          # leaves it describing the wrong thing.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Uploads the artifacts to the release release-please already made.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate, because GITHUB_TOKEN cannot write to another repository.
          # Fine-grained PAT, Contents:write on coderage-labs/homebrew-tap only.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
